spring.application.name=TheBuggerBot

discord.token=${DISCORD_TOKEN:}
discord.guild-id=${DISCORD_GUILD_ID:}

spring.datasource.url=jdbc:h2:file:./data/projectbot
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.net.dv8tion.jda=INFO
logging.level.com.yuhyfe.projectbot=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n